# Rendered by the nginx image's envsubst step at start-up (PORT, BACKEND_URL,
# NGINX_RESOLVER, CSP_ANALYTICS_ORIGIN).
server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    client_max_body_size 1m;
    gzip_static on;          # serves the .gz files written at build time
    gzip on;                 # for anything not pre-compressed
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # The backend address is looked up at request time (not once at start),
    # so a redeployed backend with a new IP is found without restarting nginx.
    resolver ${NGINX_RESOLVER} valid=10s;
    set $backend "${BACKEND_URL}";

    # Client address when nginx itself sits behind a proxy (Railway, a load balancer):
    # trust X-Forwarded-For only from REAL_IP_FROM. The default trusts nobody.
    set_real_ip_from ${REAL_IP_FROM};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    include /etc/nginx/snippets/security-headers.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # The service worker and theme script must update immediately after a deploy.
    location ~ ^/(sw\.js|theme-init\.js|manifest\.json)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /graphql {
        client_max_body_size 11m;    # 10 MB uploads (screenshots, imports) plus form overhead
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;   # replaces anything the client sent
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 70s;      # OCR can take up to a minute
        proxy_request_buffering on;
    }

    location = /export {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Share target without an active service worker (e.g. right after installing):
    # the image cannot be kept, so open the takes page with a hint to share again.
    location = /share-target {
        return 303 /reviews?share=unavailable;
    }

    # Backend + database health, for external monitoring.
    location = /healthz {
        access_log off;
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # nginx's own health (the container health check): independent of the backend.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
